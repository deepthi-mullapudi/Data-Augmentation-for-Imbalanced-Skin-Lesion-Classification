# E2: real images + classical augmentation on the rare classes.
# Rare classes are topped up to the same target count as the GAN runs (E3/E4),
# so the number of extra training images is identical across E2, E3 and E4.

experiment:
  id: E2
  name: classical_augmentation
  description: Real images plus flips, rotations and colour jitter on rare classes.

seeds: [0, 1, 2]

paths:
  data_dir: data
  cache_dir: cache
  checkpoint_dir: checkpoints
  results_dir: results
  images_cache: cache/ham64.npz
  splits_csv: cache/splits.csv

split:
  group_by: lesion_id
  stratify_by: dx
  train: 0.70
  val: 0.15
  test: 0.15
  split_seed: 42

data:
  image_size: 64
  clf_input_size: 224
  classes: [akiec, bcc, bkl, df, mel, nv, vasc]
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

classifier:
  arch: resnet18
  pretrained_weights: IMAGENET1K_V1
  loss: cross_entropy
  class_weights: false
  optimizer: adam
  lr: 1.0e-4
  weight_decay: 0.0
  batch_size: 64
  max_epochs: 20
  sampler: shuffle
  early_stopping:
    metric: val_macro_f1
    patience: 5
  num_workers: 2

augmentation:
  mode: classical
  apply_to: topup_classes        # only the rare classes; train split only
  hflip: true
  vflip: true
  rotation_degrees: 30
  color_jitter:
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05

topup:
  enabled: true
  classes: [akiec, vasc, df]
  reference_class: bcc
  target_fraction: 1.0

synthetic:
  enabled: false
  source: null
  gan_checkpoint: null
  synthetic_path: null
  quality_filter:
    enabled: false
    filter_model_experiment: E0
    confidence_threshold: 0.9
    generate_factor: 2.0
