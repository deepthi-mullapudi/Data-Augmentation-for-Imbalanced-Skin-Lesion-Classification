# Training settings for the conditional DCGAN (used by src/train_gan.py).
# Trains on the TRAIN split only, all 7 classes.

experiment:
  id: GAN_DCGAN_AUG
  name: conditional_dcgan_aug
  description:  Conditional DCGAN with DiffAugment for improved training diversity.

seeds: [0]

paths:
  data_dir: data
  cache_dir: cache
  checkpoint_dir: checkpoints
  results_dir: results
  images_cache: cache/ham64.npz
  splits_csv: cache/splits.csv

data:
  image_size: 64
  classes: [akiec, bcc, bkl, df, mel, nv, vasc]
  pixel_range: [-1, 1]

model:
  type: dcgan
  z_dim: 100
  class_embed_dim: 50
  base_channels: 512             # generator starts at 4x4x512
  d_norm: batchnorm              # discriminator normalisation
  init_std: 0.02

train:
  epochs: 200                    # time one epoch first, then scale to your 1-3 h budget
  batch_size: 64
  lr_g: 1.0e-4
  lr_d: 1.0e-4
  betas: [0.5, 0.999]
  real_label: 0.9                # one-sided label smoothing
  fake_label: 0.0
  balanced_sampler: true         # GAN training only, never the classifier
  diffaugment:
    enabled: true              # switch on if D overfits the tiny classes
    policy: color,translation,cutout

logging:
  sample_every: 5                # image grid from a fixed noise vector
  checkpoint_every: 5
  samples_per_class: 8
  best_checkpoint_name: dcgan_best.pt
